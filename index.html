<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate Please!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E3DC; --surface:#F2F6EE; --raised:#FBFDF8; --ink:#16302B; --muted:#56695F;
  --line:#AFC0B5; --guil:rgba(22,48,43,.07); --ok:#1D6A48; --no:#B3312A; --signal:#E6B21E;
  --flag:#FBE6A4; --focus:#2B3F8C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E1B; --surface:#182C28; --raised:#203833; --ink:#E3ECE6; --muted:#9CB0A7;
    --line:#35524B; --guil:rgba(227,236,230,.06); --ok:#63C493; --no:#F08277; --signal:#EFC23F;
    --flag:#5A4A12; --focus:#9FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E1B; --surface:#182C28; --raised:#203833; --ink:#E3ECE6; --muted:#9CB0A7;
  --line:#35524B; --guil:rgba(227,236,230,.06); --ok:#63C493; --no:#F08277; --signal:#EFC23F;
  --flag:#5A4A12; --focus:#9FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 Barlow,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:clamp(2.4rem,7vw,4rem);letter-spacing:-.01em}
h2{font-size:1.75rem}
h3{font-size:1.25rem}
p{margin:0 0 .8em;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:"Courier Prime","Courier New",monospace}

.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top::before{content:"";display:block;height:8px;background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,var(--ink) 14px 28px)}
.top-in{max-width:1080px;margin:0 auto;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center}
.brand{font:700 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif;background:none;border:0;padding:.2rem 0}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.35rem .6rem;font-weight:500}
nav button[aria-current="page"]{border-bottom-color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding:1.25rem 1rem 3rem}
.lead{font-size:1.2rem;max-width:56ch}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--surface);padding:.6rem 1.1rem;border-radius:4px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:.35rem .8rem;font-size:.95rem}

/* Übersicht */
.shifts{list-style:none;margin:1.5rem 0;padding:0;border-top:2px solid var(--ink)}
.shifts li{display:grid;grid-template-columns:3rem 1fr auto;gap:.25rem 1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line)}
.shifts .num{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.shifts .best{color:var(--muted);font-size:.95rem}
.more{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:1.5rem}
.more > div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem}

/* Briefing */
.brief{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--signal);border-radius:6px;padding:1.25rem;max-width:720px}
.brief h2{margin-bottom:.6rem}
.brief ul{margin:.2rem 0 1rem;padding-left:1.2rem}

/* Spiel */
.status{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:center;margin-bottom:.9rem}
.status h2{font-size:1.4rem}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:16px;border:2px solid var(--ink);border-radius:2px;display:block}
.pips i.r{background:var(--ok);border-color:var(--ok)}
.pips i.w{background:var(--no);border-color:var(--no)}
.pips i.cur{background:var(--signal)}
.points{margin-left:auto;font-weight:600}
.booth{display:grid;gap:1rem;grid-template-columns:300px 1fr;grid-template-areas:"ask cert" "tools cert" "act act";align-items:start}
.ask{grid-area:ask}.cert{grid-area:cert}.tools{grid-area:tools}.act{grid-area:act}
@media (max-width:820px){.booth{grid-template-columns:1fr;grid-template-areas:"ask" "cert" "tools" "act"}}

.ask{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem;display:grid;grid-template-columns:56px 1fr;gap:.2rem .8rem;align-items:center}
.srv{width:56px;height:auto;grid-row:span 2}
.ask small,.tools small,.cert small{display:block;color:var(--muted);font-size:.85rem}
.target{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.bubble{background:var(--raised);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:.35rem .6rem;font-size:.95rem;overflow-wrap:anywhere}

.tools{display:grid;gap:.6rem}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.7rem .9rem}
.tool.flag{background:var(--flag);border-color:var(--no)}
.tool ul{margin:.2rem 0 0;padding:0;list-style:none}
.clock{font-size:1.35rem;font-weight:700}

.cert{position:relative;background-color:var(--raised);background-image:repeating-radial-gradient(circle at 100% 0,transparent 0 11px,var(--guil) 11px 12px),repeating-radial-gradient(circle at 0 100%,transparent 0 11px,var(--guil) 11px 12px);border:1px solid var(--ink);border-radius:8px;padding:1.1rem 1.2rem 1.3rem;box-shadow:4px 4px 0 var(--line);overflow:hidden}
.cert header{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:.4rem;margin-bottom:.7rem}
.cert header h3{font-size:1.6rem}
.cert dl{margin:0;display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:.1rem .9rem}
.cert dt{color:var(--muted);font-size:.9rem;padding:.3rem 0 .3rem .4rem}
.cert dd{margin:0;padding:.25rem .4rem;font-weight:700;overflow-wrap:anywhere}
.cert .flag{background:var(--flag)}
@media (max-width:520px){.cert dl{grid-template-columns:1fr;gap:0}.cert dt{padding-bottom:0}.cert dd{padding-top:0;margin-bottom:.35rem}}
.chain{margin-top:.9rem;border-top:1px dashed var(--line);padding:.7rem .4rem .2rem}
.chain.flag{background:var(--flag)}
.chain ol{margin:.3rem 0 0;padding:0;list-style:none;display:grid;gap:.4rem}
.chain li{border:1px solid var(--line);border-radius:4px;padding:.35rem .6rem;background:var(--surface)}
.chain li b{display:block}
.stamp{position:absolute;right:1.2rem;top:4.6rem;transform:rotate(-9deg);border:4px double currentColor;border-radius:6px;padding:.1em .5em;font:700 clamp(1.5rem,5vw,2.3rem)/1.2 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--raised) 80%,transparent);animation:stamp .25s ease-out}
.stamp.ok{color:var(--ok)}.stamp.no{color:var(--no)}
@keyframes stamp{from{transform:rotate(-9deg) scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
@media (max-width:520px){.stamp{position:static;display:inline-block;margin:.9rem 0 0 .4rem}}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.choices button{padding:1rem;border-radius:6px;border:3px solid;font:700 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--surface)}
.choices .no{border-color:var(--no);color:var(--no)}
.choices .ok{border-color:var(--ok);color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:.5rem 0 0}
.reasons{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:.5rem 0}
.reasons button,.opts button{text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:.6rem .8rem;font-weight:500}
.fb{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--ok);border-radius:6px;padding:1rem 1.1rem}
.fb.w{border-left-color:var(--no)}
.fb h3{margin-bottom:.4rem}
.fb .tip{border-top:1px dashed var(--line);padding-top:.6rem;color:var(--muted)}
.fb .tip b{color:var(--ink)}

/* Auswertung, Quiz, Lexikon */
.sum{list-style:none;padding:0;margin:1rem 0;border-top:1px solid var(--line);max-width:720px}
.sum li{display:flex;gap:.8rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.sum .m{font-weight:700;width:5.5rem;flex:none}
.sum .m.r{color:var(--ok)}.sum .m.w{color:var(--no)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.quiz{max-width:720px}
.quiz .q{font-size:1.2rem;font-weight:500;margin:.6rem 0 1rem}
.opts{display:grid;gap:.5rem;margin-bottom:1rem}
.opts button[disabled]{cursor:default;opacity:.75}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface));opacity:1}
.opts button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--surface));opacity:1}
.lex{max-width:760px}
.lex details{border-bottom:1px solid var(--line);padding:.6rem 0}
.lex summary{font:600 1.3rem/1.2 "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.lex details > div{padding:.5rem 0 .2rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;min-width:420px}
th,td{text-align:left;padding:.3rem .8rem .3rem 0;border-bottom:1px solid var(--line);vertical-align:top}
pre{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.6rem .8rem;overflow-x:auto;font:400 .9rem/1.5 "Courier Prime","Courier New",monospace;margin:.3rem 0 .8rem}
code{font-family:"Courier Prime","Courier New",monospace;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="tab" data-v="home">Certificate Please!</button>
    <nav aria-label="Bereiche">
      <button data-act="tab" data-v="home" data-tab="home">Kontrolle</button>
      <button data-act="tab" data-v="quiz" data-tab="quiz">Kundenfälle</button>
      <button data-act="tab" data-v="lex" data-tab="lex">Nachschlagen</button>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
/* ---------- Hilfen ---------- */
const app = document.getElementById('app');
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(12,0,0,0);
const day = n => new Date(NOW.getTime() + n*DAY);
const fmt = d => d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hash = s => [...s].reduce((a,c) => (a*37 + c.charCodeAt(0)) % 99991, 7);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = { get(){ try{ return JSON.parse(localStorage.getItem('zk-best')||'{}'); }catch(e){ return {}; } },
                set(v){ try{ localStorage.setItem('zk-best', JSON.stringify(v)); }catch(e){} } };

/* ---------- Daten: Kontrolle ---------- */
const STORE = ['Nordtor Root CA','Rheinsiegel Root CA','Globus Trust Root'];
const REASONS = { datum:'Datum stimmt nicht', name:'Name passt nicht', kette:'Aussteller oder Kette nicht vertrauenswürdig', gesperrt:'Zertifikat ist widerrufen' };
const C = o => Object.assign({ san:[o.cn], from:-60, to:140, issuer:'Nordtor DV CA 2', chain:[['Nordtor DV CA 2','Nordtor Root CA']], store:STORE, revoked:null, clock:0, device:'Dein Rechner', tip:'' }, o);

const LEVELS = [
 { id:1, name:'Datum', sub:'Gültig von, gültig bis',
   brief:['Jedes Zertifikat hat ein Start- und ein Enddatum.','Vergleiche beide mit dem Datum deiner Systemuhr. Liegt heute nicht dazwischen: abweisen.','In dieser Schicht stimmen Name und Aussteller immer.'] },
 { id:2, name:'Name', sub:'Passt der Ausweis zur aufgerufenen Adresse?',
   brief:['Die aufgerufene Adresse muss in der Liste »Gilt für« stehen. Nur diese Liste zählt (sie heißt SAN).','Ein Stern ersetzt genau eine Ebene: *.firma.de passt auf mail.firma.de.','Er passt nicht auf a.b.firma.de und nicht auf firma.de selbst.'] },
 { id:3, name:'Aussteller und Kette', sub:'Wer hat unterschrieben, und kennst du ihn?',
   brief:['Jedes Zertifikat nennt seinen Aussteller. Der Server liefert die Zwischenzertifikate mit.','Folge der Kette von Aussteller zu Aussteller. Am Ende muss eine Root stehen, die in deinem Trust Store liegt.','Fehlt ein Glied, ist die Root unbekannt oder hat der Server sich selbst unterschrieben: abweisen.'] },
 { id:4, name:'Sperrung und Sonderfälle', sub:'Widerrufene Zertifikate und ein paar Fallen',
   brief:['Eine CA kann ein Zertifikat vor Ablauf sperren, etwa wenn der private Schlüssel gestohlen wurde.','Prüfe ab jetzt auch die Sperrabfrage.','Außerdem kann alles aus den ersten drei Schichten vorkommen.'] },
 { id:5, name:'Gemischte Schicht', sub:'Zehn zufällige Fälle aus allen Regeln',
   brief:['Zehn Fälle quer durch alle Regeln, in zufälliger Reihenfolge.','Prüfe jedes Mal alle vier Punkte: Datum, Name, Kette, Sperrung.'] }
];

const CASES = [
 /* Schicht 1 */
 C({lvl:1,target:'shop.firma.de',cn:'shop.firma.de',
    why:'Heute liegt zwischen Start- und Enddatum. Alles in Ordnung.'}),
 C({lvl:1,target:'www.kunde.de',cn:'www.kunde.de',from:-200,to:-1,
    why:'Seit gestern abgelaufen. Ein Tag reicht, der Browser macht keine Ausnahme. Ob dahinter ein Angreifer steckt oder ein Admin, der die Verlängerung vergessen hat, kannst du nicht erkennen.',
    tip:'Ablaufdaten gehören ins Monitoring, mit mindestens 14 Tagen Vorwarnung.'}),
 C({lvl:1,target:'mail.firma.de',cn:'mail.firma.de',from:-198,to:2,
    why:'Läuft erst übermorgen ab, ist also noch gültig.',
    tip:'Für den Admin ist das trotzdem ein Alarm: jetzt erneuern.'}),
 C({lvl:1,target:'portal.kunde.de',cn:'portal.kunde.de',from:3,to:203,
    why:'Das Zertifikat gilt erst in drei Tagen. Vor dem Startdatum ist es genauso ungültig wie nach dem Enddatum.',
    tip:'Passiert, wenn ein Zertifikat zu früh eingespielt wird oder eine Uhr falsch geht.'}),
 C({lvl:1,target:'cloud.firma.de',cn:'cloud.firma.de',from:-1,to:199,
    why:'Gestern ausgestellt, gilt 200 Tage. Länger darf ein öffentliches Zertifikat seit März 2026 nicht mehr laufen.'}),
 C({lvl:1,target:'www.firma.de',cn:'www.firma.de',from:-30,to:170,clock:-4100,device:'Alter PC im Lager',
    why:'Nach dieser Systemuhr gilt das Zertifikat noch gar nicht, also muss der Browser abweisen. Schau aufs Datum: Die Uhr des Rechners geht um Jahre nach. Das Zertifikat ist in Ordnung, der Fehler liegt beim Client.',
    tip:'Meldet ein einzelner PC bei allen Seiten Zertifikatsfehler: zuerst Uhrzeit, Zeitserver und BIOS-Batterie prüfen.'}),
 /* Schicht 2 */
 C({lvl:2,target:'www.firma.de',cn:'www.firma.de',san:['www.firma.de','firma.de'],
    why:'www.firma.de steht in der Liste. Passt.'}),
 C({lvl:2,target:'mail.firma.de',cn:'www.firma.de',san:['www.firma.de','firma.de'],
    why:'mail.firma.de steht nicht im Zertifikat. Ein Zertifikat für www.firma.de sagt nichts über mail.firma.de aus, auch wenn beide derselben Firma gehören.',
    tip:'Typisch, wenn das Web-Zertifikat einfach auf den Mailserver kopiert wurde. Lösung: Reissue mit zusätzlichem Namen.'}),
 C({lvl:2,target:'shop.firma.de',cn:'*.firma.de',san:['*.firma.de','firma.de'],
    why:'Der Stern ersetzt genau eine Ebene. »shop« ist eine Ebene, also passt es.'}),
 C({lvl:2,target:'dev.shop.firma.de',cn:'*.firma.de',san:['*.firma.de','firma.de'],
    why:'Der Stern deckt nur eine Ebene ab. dev.shop.firma.de hat zwei Ebenen vor firma.de. Dafür bräuchte man *.shop.firma.de oder den Namen direkt in der Liste.'}),
 C({lvl:2,target:'firma.de',cn:'*.firma.de',san:['*.firma.de'],
    why:'*.firma.de verlangt irgendetwas vor dem Punkt. Die nackte Domain firma.de ist damit nicht abgedeckt, sie muss extra in der Liste stehen.',
    tip:'Die meisten CAs tragen sie beim Wildcard automatisch mit ein. Trotzdem nachsehen.'}),
 C({lvl:2,target:'portal.kunde.de',cn:'www.kunde.de',san:['www.kunde.de','kunde.de','portal.kunde.de'],
    why:'Unter »Ausgestellt für« steht ein anderer Name, aber das Feld zählt nicht. Browser prüfen nur die Liste »Gilt für«, und dort steht portal.kunde.de.'}),
 C({lvl:2,target:'192.168.10.1',cn:'firewall.firma.de',
    why:'Aufgerufen wurde die IP-Adresse, im Zertifikat steht nur der Name. Für den Browser sind das zwei verschiedene Dinge.',
    tip:'Der Klassiker bei Firewall- und Switch-Oberflächen. Über den DNS-Namen aufrufen statt über die IP.'}),
 C({lvl:2,target:'firma.de',cn:'firrna.de',san:['firrna.de','www.firrna.de'],
    why:'Lies genau: Im Zertifikat steht firrna.de, mit r und n statt m. Jemand hat eine Vertipper-Domain registriert und gibt sich damit als firma.de aus.'}),
 /* Schicht 3 */
 C({lvl:3,target:'www.kunde.de',cn:'www.kunde.de',
    why:'Die Kette ist vollständig: Das Server-Zertifikat stammt von Nordtor DV CA 2, die wiederum von Nordtor Root CA. Diese Root liegt in deinem Trust Store.'}),
 C({lvl:3,target:'www.firma.de',cn:'www.firma.de',issuer:'www.firma.de',chain:[],
    why:'Aussteller und Inhaber sind identisch: Der Server hat sich den Ausweis selbst geschrieben. Das kann jeder, auch ein Angreifer.',
    tip:'Selbstsigniert ist nur für Tests in Ordnung. Kunden nie beibringen, die Warnung wegzuklicken.'}),
 C({lvl:3,target:'shop.firma.de',cn:'shop.firma.de',issuer:'SecureFast TLS CA',chain:[['SecureFast TLS CA','SecureFast Root']],
    why:'Die Kette ist lückenlos, endet aber bei SecureFast Root. Diese Root liegt nicht in deinem Trust Store, also ist die ganze Kette nichts wert.'}),
 C({lvl:3,target:'mail.kunde.de',cn:'mail.kunde.de',issuer:'Rheinsiegel TLS CA 1',chain:[],
    why:'Der Aussteller Rheinsiegel TLS CA 1 ist ein Zwischenzertifikat. Der Server hat es nicht mitgeliefert, und in deinem Trust Store liegen nur Roots. Die Verbindung zur Rheinsiegel Root CA lässt sich nicht herstellen.',
    tip:'Kein Angriff, sondern der häufigste Konfigurationsfehler. Manche Browser holen das Zwischenzertifikat selbst nach, darum fällt es oft erst bei Apps, curl oder Mailprogrammen auf. Lösung: Zwischenzertifikat auf dem Server nachinstallieren.'}),
 C({lvl:3,target:'intranet.firma.local',cn:'intranet.firma.local',issuer:'Firma Issuing CA',chain:[['Firma Issuing CA','Firma Intern Root CA']],store:[...STORE,'Firma Intern Root CA'],device:'Firmen-Laptop',
    why:'Die Root der firmeneigenen CA liegt im Trust Store dieses Laptops, weil die IT sie verteilt hat. Damit ist die Kette gültig.'}),
 C({lvl:3,target:'intranet.firma.local',cn:'intranet.firma.local',issuer:'Firma Issuing CA',chain:[['Firma Issuing CA','Firma Intern Root CA']],device:'Privates Handy',
    why:'Gleicher Server, gleiches Zertifikat, anderes Gerät. Auf dem privaten Handy fehlt die Firmen-Root, also endet die Kette hier im Unbekannten.',
    tip:'Interne CAs funktionieren nur auf Geräten, die die Root bekommen haben, per Gruppenrichtlinie oder MDM.'}),
 C({lvl:3,target:'cloud.kunde.de',cn:'cloud.kunde.de',issuer:'Globus TLS CA G3',chain:[['Globus TLS CA G3','Globus Regional CA'],['Globus Regional CA','Globus Trust Root']],
    why:'Zwei Zwischenzertifikate, beide mitgeliefert. Die Kette darf länger sein, solange kein Glied fehlt und am Ende eine bekannte Root steht.'}),
 /* Schicht 4 */
 C({lvl:4,target:'shop.kunde.de',cn:'shop.kunde.de',revoked:-18,
    why:'Datum, Name und Kette stimmen. Aber die CA hat das Zertifikat vor 18 Tagen gesperrt, weil der private Schlüssel in fremde Hände geraten ist. Wer es jetzt noch vorlegt, kann der Dieb sein.'}),
 C({lvl:4,target:'firma-rechnungsportal.de',cn:'firma-rechnungsportal.de',device:'Link aus einer Mail angeklickt',
    why:'Das Zertifikat ist einwandfrei, also muss der Browser durchlassen und zeigt das Schloss. Es beweist nur, dass du wirklich mit firma-rechnungsportal.de sprichst. Ob diese Seite seriös ist, sagt es nicht.',
    tip:'Phishing-Seiten haben fast immer gültige Zertifikate. Das Schloss heißt »verschlüsselt und echt benannt«, nicht »vertrauenswürdig«. Das solltest du Kunden so erklären können.'}),
 C({lvl:4,target:'drucker.firma.de',cn:'drucker.firma.de',issuer:'drucker.firma.de',chain:[],from:-400,to:-35,
    why:'Gleich zwei Gründe: abgelaufen und selbstsigniert. Einer hätte gereicht.',
    tip:'So sehen Geräte aus, die seit der Installation niemand mehr angefasst hat: Drucker, Kameras, alte NAS.'}),

/* Prüflogik: bestimmt aus den Daten, was richtig ist */
function nameOk(target, san){
  return san.some(n => n.startsWith('*.') ? (target.endsWith(n.slice(1)) && !target.slice(0, -n.length+1).includes('.') && target.length > n.length-1) : n === target);
}
function chainOk(c){
  if (c.issuer === c.cn) return false;
  let iss = c.issuer, guard = 0;
  while (guard++ < 6){
    if (c.store.includes(iss)) return true;
    const link = c.chain.find(x => x[0] === iss);
    if (!link) return false;
    iss = link[1];
  }
  return false;
}
function verdict(c){
  const r = [];
  if (c.clock < c.from || c.clock > c.to) r.push('datum');
  if (!nameOk(c.target, c.san)) r.push('name');
  if (!chainOk(c)) r.push('kette');
  if (c.revoked !== null) r.push('gesperrt');
  return { ok: r.length === 0, reasons: r };
}

function actHTML(c){
  if (S.phase === 'decide') return `
    <div class="choices">
      <button class="no" data-act="decide" data-v="no">Abweisen</button>
      <button class="ok" data-act="decide" data-v="ok">Durchlassen</button>
    </div>
    <p class="hint">Tastatur: Pfeil links weist ab, Pfeil rechts lässt durch.</p>`;
  if (S.phase === 'reason') return `
    <h3>Warum weist du ab?</h3>
    <div class="reasons">${Object.entries(REASONS).map(([k,t],i) => `<button data-act="reason" data-v="${k}"${i===0?' data-focus':''}>${i+1}. ${esc(t)}</button>`).join('')}</div>
    <button class="btn ghost small" data-act="back">Doch nicht abweisen</button>`;
  const f = S.fb, last = S.i === S.queue.length - 1;
  return `<div class="fb${f.right && !f.half ? '' : ' w'}">
    <h3>${esc(f.head)}</h3>
    <p>${esc(c.why)}</p>
    ${c.tip ? `<p class="tip"><b>In der Praxis:</b> ${esc(c.tip)}</p>` : ''}
    <button class="btn" data-act="next" data-focus>${last ? 'Schicht auswerten' : 'Nächster Fall'}</button>
  </div>`;
}

function settle(choice, reason){
  const c = S.queue[S.i], v = verdict(c);
  const right = (choice === 'ok') === v.ok;
  let pts = 0, head, half = false;
  if (right && v.ok){ pts = 10; head = 'Richtig durchgelassen.'; }
  else if (right && v.reasons.includes(reason)){ pts = 15; head = 'Richtig abgewiesen, richtiger Grund.'; }
  else if (right){ pts = 10; half = true; head = 'Richtig abgewiesen, aber der Grund war ein anderer: ' + v.reasons.map(r => REASONS[r]).join(' und ') + '.'; }
  else if (v.ok){ head = 'Falsch. Dieses Zertifikat war in Ordnung.'; }
  else { head = 'Falsch. Das hättest du abweisen müssen: ' + v.reasons.map(r => REASONS[r]).join(' und ') + '.'; }
  S.pts += pts; S.choice = choice; S.phase = 'done';
  S.fb = { right, half, head };
  S.res[S.i] = { right, target:c.target, reasons:v.reasons };
  play();
}

function levelEnd(){
  view = 'end';
  const n = S.queue.length, r = S.res.filter(x => x.right).length, l = LEVELS.find(x => x.id === S.lvl);
  const best = store.get();
  if (!best[S.lvl] || r > best[S.lvl].r){ best[S.lvl] = { r, n }; store.set(best); }
  const verdictText = r === n ? 'Fehlerfrei.' : r >= n*0.7 ? 'Solide. Schau dir die Fehler an, dann sitzt es.' : 'Das reicht noch nicht. Lies die Regeln noch einmal und wiederhole die Schicht.';
  app.innerHTML = `
  <h2>Schicht ${l.id} beendet</h2>
  <p class="lead" style="margin-top:.5rem">${r} von ${n} richtig entschieden, ${S.pts} Punkte. ${verdictText}</p>
  <ul class="sum">${S.res.map(x => `<li><span class="m ${x.right ? 'r' : 'w'}">${x.right ? 'Richtig' : 'Falsch'}</span><span><span class="mono">${esc(x.target)}</span><br><small style="color:var(--muted)">${x.reasons.length ? x.reasons.map(k => REASONS[k]).join(', ') : 'Zertifikat in Ordnung'}</small></span></li>`).join('')}</ul>

}

function quizHome(){
  view = 'quiz'; setTab('quiz');
  Q = { list: shuffle(QUIZ).map(q => ({ q:q.q, why:q.why, right:q.o[0], opts:shuffle(q.o) })), i:0, r:0, picked:null };
  quizShow();
}
function quizShow(){
  const q = Q.list[Q.i], done = Q.picked !== null, last = Q.i === Q.list.length - 1;
  app.innerHTML = `<div class="quiz">
    <div class="status"><h2>Kundenfälle</h2><span>Fall ${Q.i+1} von ${Q.list.length}</span><span class="points">${Q.r} richtig</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o,i) => `<button data-act="pick" data-v="${i}" ${done ? 'disabled' : ''} class="${done && o === q.right ? 'right' : done && i === Q.picked ? 'wrong' : ''}">${esc(o)}</button>`).join('')}</div>
    <div aria-live="polite">${done ? `<div class="fb${q.opts[Q.picked] === q.right ? '' : ' w'}"><h3>${q.opts[Q.picked] === q.right ? 'Richtig.' : 'Falsch.'}</h3><p>${esc(q.why)}</p><button class="btn" data-act="qnext" data-focus>${last ? 'Auswertung ansehen' : 'Nächster Fall'}</button></div>` : ''}</div>
  </div>`;
  const f = app.querySelector('[data-focus]'); if (f) f.focus();
}
function quizEnd(){
  const n = Q.list.length;
  app.innerHTML = `<div class="quiz"><h2>Kundenfälle beendet</h2>
    <p class="lead" style="margin-top:.5rem">${Q.r} von ${n} richtig. ${Q.r === n ? 'Fehlerfrei.' : Q.r >= n*0.75 ? 'Gut. Die Fehler noch einmal nachlesen.' : 'Hier fehlt noch Grundlage. Unter Nachschlagen stehen Renew, Reissue, CSR und die Dateiformate.'}</p>
    <div class="row"><button class="btn" data-act="tab" data-v="quiz">Noch einmal, neu gemischt</button><button class="btn ghost" data-act="tab" data-v="lex">Nachschlagen öffnen</button></div></div>`;
}

/* ---------- Ansicht: Nachschlagen ---------- */
function lex(){
  view = 'lex'; setTab('lex');
  app.innerHTML = `<div class="lex"><h2>Nachschlagen</h2>
    <p style="margin-top:.5rem">Jeder Begriff in ein paar Sätzen. Aufklappen, was du brauchst.</p>
    ${LEX.map(([t,h]) => `<details><summary>${esc(t)}</summary><div>${h}</div></details>`).join('')}</div>`;
}

/* ---------- Steuerung ---------- */
const ACT = {
  tab(v){ v === 'quiz' ? quizHome() : v === 'lex' ? lex() : home(); window.scrollTo(0,0); },
  brief(v){ brief(v); window.scrollTo(0,0); },
  start(v){ start(v); window.scrollTo(0,0); },
  decide(v){ if (!S || S.phase !== 'decide') return; if (v === 'ok') settle('ok'); else { S.phase = 'reason'; play(); } },
  reason(v){ if (S && S.phase === 'reason') settle('no', v); },
  back(){ S.phase = 'decide'; play(); },
  next(){ if (!S || S.phase !== 'done') return; if (S.i === S.queue.length - 1) levelEnd(); else { S.i++; S.phase = 'decide'; S.choice = null; play(); } window.scrollTo(0,0); },
  pick(v){ if (Q.picked !== null) return; Q.picked = +v; if (Q.list[Q.i].opts[Q.picked] === Q.list[Q.i].right) Q.r++; quizShow(); },
  qnext(){ if (Q.i === Q.list.length - 1) quizEnd(); else { Q.i++; Q.picked = null; quizShow(); } window.scrollTo(0,0); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.v);
});
document.addEventListener('keydown', e => {
  if (view !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.phase === 'decide'){
    if (e.key === 'ArrowLeft'){ e.preventDefault(); ACT.decide('no'); }
    if (e.key === 'ArrowRight'){ e.preventDefault(); ACT.decide('ok'); }
  } else if (S.phase === 'reason'){
    const k = ['1','2','3','4'].indexOf(e.key);
    if (k > -1) ACT.reason(Object.keys(REASONS)[k]);
  }
});
home();
</script>
</body>
</html>
