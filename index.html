<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate Please!</title>
<meta name="description" content="Lernspiel zu TLS-Zertifikaten: Du bist der Browser und prüfst Zertifikate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E3DC; --bg2:#CBD8CF; --surface:#F2F6EE; --raised:#FBFDF8; --ink:#16302B; --muted:#56695F;
  --line:#AFC0B5; --guil:rgba(22,48,43,.07); --ok:#1D6A48; --no:#B3312A; --signal:#E6B21E;
  --flag:#FBE6A4; --focus:#2B3F8C; --shadow:rgba(22,48,43,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E1B; --bg2:#0B1714; --surface:#182C28; --raised:#203833; --ink:#E3ECE6; --muted:#9CB0A7;
    --line:#35524B; --guil:rgba(227,236,230,.06); --ok:#63C493; --no:#F08277; --signal:#EFC23F;
    --flag:#5A4A12; --focus:#9FB0FF; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E1B; --bg2:#0B1714; --surface:#182C28; --raised:#203833; --ink:#E3ECE6; --muted:#9CB0A7;
  --line:#35524B; --guil:rgba(227,236,230,.06); --ok:#63C493; --no:#F08277; --signal:#EFC23F;
  --flag:#5A4A12; --focus:#9FB0FF; --shadow:rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--guil) 1px,transparent 0);background-size:22px 22px;color:var(--ink);font:400 1.0625rem/1.5 Barlow,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:clamp(2.6rem,8vw,4.6rem);letter-spacing:-.01em}
h2{font-size:1.85rem}
h3{font-size:1.3rem}
p{margin:0 0 .8em;max-width:68ch}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:"Courier Prime","Courier New",monospace}
.ico{display:inline-flex;vertical-align:-.15em}
.ico svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kicker{display:inline-block;font:700 .8rem/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.top::before{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,var(--ink) 14px 28px);background-size:40px 40px;animation:tape 3s linear infinite}
@keyframes tape{to{background-position:40px 0}}
.top-in{max-width:1120px;margin:0 auto;padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;align-items:center}
.brand{display:flex;align-items:center;gap:.45rem;font:700 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif;background:none;border:0;padding:.2rem 0}
.brand svg{width:30px;height:30px}
nav{display:flex;gap:.15rem;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.35rem .55rem;font-weight:600;color:var(--muted);transition:color .2s,border-color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{border-bottom-color:var(--signal);color:var(--ink)}
.ctrl{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.switch{display:flex;align-items:center;gap:.5rem;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:.3rem .75rem .3rem .35rem;font-weight:600;font-size:.95rem}
.switch .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--raised);box-shadow:0 1px 3px var(--shadow);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.switch[aria-pressed="true"] .sw{background:var(--ok)}
.switch[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);border-radius:50%}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"] .on,.icon-btn[aria-pressed="true"] .off{display:none}
@media (max-width:640px){.switch .lbl-long{display:none}.top{position:static}}

main{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 7rem}
main.enter > *{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
main.enter > *:nth-child(2){animation-delay:.05s}
main.enter > *:nth-child(3){animation-delay:.1s}
main.enter > *:nth-child(4){animation-delay:.15s}
main.enter > *:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.lead{font-size:1.2rem;max-width:56ch}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--ink);background:var(--ink);color:var(--surface);padding:.6rem 1.1rem;border-radius:6px;font-weight:600;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.small{padding:.35rem .8rem;font-size:.95rem}
.btn.big{padding:.85rem 1.4rem;font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem;box-shadow:0 2px 0 var(--line)}

/* Startseite */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center;margin-bottom:2rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-art{order:-1}}
.note{display:flex;gap:.7rem;align-items:flex-start;margin-top:1.2rem;padding:.8rem 1rem;background:var(--raised);border:1px dashed var(--line);border-radius:8px;font-size:.98rem;max-width:56ch}
.note .bear{width:44px;flex:none}
.hero-art{position:relative;height:260px;border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);overflow:hidden}
.hero-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 60px),var(--bg2);border-top:2px solid var(--ink)}
.hq{position:absolute;left:6%;bottom:40px;display:flex;gap:8px;align-items:flex-end;z-index:1}
.hq .srv{width:62px;animation:bob 2.2s ease-in-out infinite}
.hq .srv:nth-child(2){width:54px;animation-delay:-.7s;opacity:.85}
.hq .srv:nth-child(3){width:48px;animation-delay:-1.4s;opacity:.7}
@keyframes bob{50%{transform:translateY(-5px)}}
.mini-cert{position:absolute;right:8%;top:28px;width:52%;max-width:220px;background:var(--raised);border:1px solid var(--ink);border-radius:8px;padding:.7rem .8rem;box-shadow:4px 4px 0 var(--line);transform:rotate(4deg);animation:float 5s ease-in-out infinite;z-index:1}
.mini-cert b{font:700 1.2rem/1 "Barlow Condensed",sans-serif;display:block;border-bottom:2px solid var(--ink);padding-bottom:.3rem;margin-bottom:.4rem}
.mini-cert i{display:block;height:7px;border-radius:4px;background:var(--line);margin:.35rem 0}
.mini-cert i:nth-of-type(2){width:70%}.mini-cert i:nth-of-type(3){width:85%}
.mini-cert .stamp{position:absolute;right:-.4rem;bottom:-.8rem;top:auto;font-size:1.4rem;animation:stamp 1s 1s ease-out both}
@keyframes float{50%{transform:rotate(2deg) translateY(-6px)}}
.overall{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;margin:0 0 1rem}
.bar{flex:1 1 220px;height:12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--signal));border-radius:99px;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.levels{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:.8rem 0 2rem}
.lvl{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem 1rem 4.4rem;min-height:120px;box-shadow:0 3px 0 var(--line);transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.lvl:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line);border-color:var(--ink)}
.lvl .num{position:absolute;left:1rem;top:1rem;width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:8px;background:var(--ink);color:var(--surface);font:700 1.6rem/1 "Barlow Condensed",sans-serif}
.lvl .lvl-t{display:block;font:600 1.3rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin-bottom:.2rem}
.lvl .sub{display:block;color:var(--muted);font-size:.95rem;line-height:1.35}
.lvl .best{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.88rem;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars .on{fill:var(--signal);stroke:color-mix(in srgb,var(--signal) 60%,var(--ink))}
.stars .off{fill:none;stroke:var(--line)}
.stars.big svg{width:44px;height:44px}
.stars.big svg{animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars.big svg:nth-child(2){animation-delay:.25s}.stars.big svg:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.more{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.more .card h3{display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem}

/* Briefing */
.brief{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--signal);border-radius:10px;padding:1.4rem;max-width:760px;box-shadow:0 3px 0 var(--line)}
.brief h2{margin-bottom:.7rem}
.brief ul{margin:.2rem 0 1rem;padding-left:1.2rem}
.brief li{margin-bottom:.3rem}
.checks{display:grid;gap:.5rem;margin:.6rem 0 1rem}
.checks div{display:grid;grid-template-columns:2.2rem 1fr;gap:.1rem .6rem;align-items:start;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
.checks .ico{grid-row:span 2;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.checks small{color:var(--muted);font-size:.92rem}
.mode-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .6rem;border-radius:99px;background:color-mix(in srgb,var(--ok) 18%,var(--surface));border:1px solid var(--ok);font-size:.88rem;font-weight:600}

/* Spiel */
.status{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;margin-bottom:1rem}
.status h2{font-size:1.45rem}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:18px;height:18px;border:2px solid var(--ink);border-radius:4px;display:block;transition:background .3s}
.pips i.r{background:var(--ok);border-color:var(--ok);animation:pop .4s both}
.pips i.w{background:var(--no);border-color:var(--no);animation:pop .4s both}
.pips i.cur{background:var(--signal);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.8)}}
.points{margin-left:auto;font-weight:700;display:flex;align-items:center;gap:.8rem;position:relative}
.points .pts{font:700 1.6rem/1 "Barlow Condensed",sans-serif}
.streak{font-size:.85rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;background:var(--signal);color:#16302B;animation:pop .4s both}
.gain{position:absolute;right:0;top:1.7rem;font:700 1.3rem/1 "Barlow Condensed",sans-serif;color:var(--ok);animation:gain 1.2s ease-out forwards;pointer-events:none}
.gain.zero{color:var(--no)}
@keyframes gain{from{transform:translateY(0);opacity:1}to{transform:translateY(-36px);opacity:0}}

.booth{display:grid;gap:1rem;grid-template-columns:310px 1fr;grid-template-areas:"ask cert" "tools cert" "act act";align-items:start}
.booth.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.ask{grid-area:ask}.cert{grid-area:cert}.tools{grid-area:tools}.act{grid-area:act}
@media (max-width:840px){.booth{grid-template-columns:1fr;grid-template-areas:"ask" "cert" "tools" "act"}}

.ask{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem;overflow:hidden}
.who{display:grid;grid-template-columns:62px 1fr;gap:.7rem;align-items:center}
.srv{width:62px;height:auto;display:block}
.booth.fresh .who .srv-wrap{animation:walkin .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes walkin{from{transform:translateX(-90px)}}
.who .srv{animation:bob 2.2s ease-in-out infinite}
.who.happy .srv{animation:hop .45s ease-out 2}
.who.sad .srv{animation:none;transform:rotate(-7deg) translateY(4px);filter:saturate(.4)}
@keyframes hop{40%{transform:translateY(-12px)}}
.bubble{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:.45rem .7rem;font-size:.95rem;overflow-wrap:anywhere}
.booth.fresh .bubble{animation:rise .4s .45s both}
.urlbar{display:flex;align-items:center;gap:.45rem;margin-top:.8rem;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:.4rem .8rem;font-size:.93rem;font-weight:700;overflow-wrap:anywhere}
.urlbar .ico{color:var(--muted)}
.ask small,.tools small,.cert small{display:block;color:var(--muted);font-size:.85rem}

.tools{display:grid;gap:.6rem}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;transition:background .3s}
.tool small{display:flex !important;align-items:center;gap:.35rem}
.tool.flag{background:var(--flag);border-color:var(--no)}
.tool ul{margin:.25rem 0 0;padding:0;list-style:none}
.tool li::before{content:"◆ ";color:var(--ok);font-size:.7em}
.clock{font-size:1.4rem;font-weight:700}

.cert{position:relative;background-color:var(--raised);background-image:repeating-radial-gradient(circle at 100% 0,transparent 0 11px,var(--guil) 11px 12px),repeating-radial-gradient(circle at 0 100%,transparent 0 11px,var(--guil) 11px 12px);border:1px solid var(--ink);border-radius:10px;padding:1.1rem 1.2rem 1.3rem;box-shadow:5px 5px 0 var(--line);overflow:hidden}
.booth.fresh .cert{animation:slidein .6s .15s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes slidein{from{transform:translateY(40px) rotate(4deg);opacity:0}}
.cert.thump{animation:thump .35s ease-out}
@keyframes thump{30%{transform:scale(.985) translateY(3px)}}
.cert::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;border:10px double var(--guil)}
.cert header{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:.4rem;margin-bottom:.7rem}
.cert header h3{font-size:1.6rem;display:flex;align-items:center;gap:.4rem}
.cert dl{margin:0;display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:.15rem .9rem}
.cert dt{color:var(--muted);font-size:.9rem;padding:.3rem 0 .3rem .4rem;border-radius:4px}
.cert dd{margin:0;padding:.25rem .4rem;font-weight:700;overflow-wrap:anywhere;border-radius:4px}
.cert .flag{background:var(--flag)}
@media (max-width:520px){.cert dl{grid-template-columns:1fr;gap:0}.cert dt{padding-bottom:0}.cert dd{padding-top:0;margin-bottom:.35rem}}
.chain{margin-top:.9rem;border-top:1px dashed var(--line);padding:.7rem .4rem .2rem;border-radius:4px}
.chain.flag{background:var(--flag)}
.chain ol{margin:.3rem 0 0;padding:0;list-style:none;display:grid;gap:.4rem}
.chain li{border:1px solid var(--line);border-radius:6px;padding:.35rem .6rem;background:var(--surface)}
.chain li b{display:block}
.stamp{position:absolute;right:1.2rem;top:4.6rem;transform:rotate(-9deg);border:4px double currentColor;border-radius:6px;padding:.1em .5em;font:700 clamp(1.5rem,5vw,2.4rem)/1.2 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--raised) 80%,transparent);animation:stamp .35s cubic-bezier(.3,1.5,.5,1) both;z-index:2}
.stamp.ok{color:var(--ok)}.stamp.no{color:var(--no)}
@keyframes stamp{from{transform:rotate(-20deg) scale(2.4);opacity:0}60%{opacity:1}}
@media (max-width:520px){.cert .stamp{position:static;display:inline-block;margin:.9rem 0 0 .4rem}}

/* Hervorhebung im einfachen Modus */
.booth.focus-datum .k-datum,.booth.focus-name .k-name,.booth.focus-kette .k-kette,.booth.focus-gesperrt .k-gesperrt{background:var(--flag);box-shadow:0 0 0 2px var(--signal);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--signal) 35%,transparent)}}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.choices button{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem;border-radius:10px;border:3px solid;font:700 1.55rem/1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--surface);transition:transform .15s,background .2s,color .2s;box-shadow:0 4px 0 currentColor}
.choices button:hover{transform:translateY(-2px)}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 currentColor}
.choices .no{border-color:var(--no);color:var(--no)}
.choices .ok{border-color:var(--ok);color:var(--ok)}
.choices .no:hover{background:var(--no);color:var(--surface)}
.choices .ok:hover{background:var(--ok);color:var(--surface)}
.choices.sm button{font-size:1.2rem;padding:.75rem}
.hint{color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
kbd{font:700 .8em "Courier Prime",monospace;border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:0 .35em;background:var(--raised)}
.reasons{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:.6rem 0}
.reasons button,.opts button{display:flex;gap:.6rem;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:.65rem .85rem;font-weight:500;transition:transform .15s,background .2s}
.reasons button:hover,.opts button:not([disabled]):hover{transform:translateX(3px);background:var(--raised)}
.fb{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--ok);border-radius:10px;padding:1rem 1.1rem;animation:rise .35s both}
.fb.w{border-left-color:var(--no)}
.fb h3{margin-bottom:.45rem}
.fb .tip{border-top:1px dashed var(--line);padding-top:.6rem;color:var(--muted)}
.fb .tip b{color:var(--ink)}
.fb-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media (max-width:760px){.fb-grid{grid-template-columns:1fr}}
.proto{list-style:none;margin:.3rem 0 .6rem;padding:0;display:grid;gap:.4rem}
.proto li{display:grid;grid-template-columns:1.7rem 1fr;gap:.5rem;align-items:start;font-size:.95rem;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;animation:rise .3s both}
.proto li:nth-child(2){animation-delay:.07s}.proto li:nth-child(3){animation-delay:.14s}.proto li:nth-child(4){animation-delay:.21s}
.proto .pi{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--surface)}
.proto li.r .pi{background:var(--ok)}.proto li.w .pi{background:var(--no)}
.proto b{display:block}
.proto span:not(.pi){overflow-wrap:anywhere}

/* Geführter Modus */
.guide{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--signal);border-radius:10px;padding:1rem 1.1rem;animation:rise .3s both}
.gsteps{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.gsteps span{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;border:1px solid var(--line);font-size:.88rem;font-weight:600;background:var(--raised);color:var(--muted)}
.gsteps span.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px var(--signal)}
.gsteps span.r{background:color-mix(in srgb,var(--ok) 18%,var(--raised));border-color:var(--ok);color:var(--ink)}
.gsteps span.w{background:color-mix(in srgb,var(--no) 18%,var(--raised));border-color:var(--no);color:var(--ink)}
.guide .q{font-size:1.2rem;font-weight:600;margin-bottom:.3rem}
.guide .where{color:var(--muted);font-size:.95rem}
.verdict-line{padding:.6rem .8rem;border-radius:8px;margin:.5rem 0 .8rem;font-weight:500}
.verdict-line.r{background:color-mix(in srgb,var(--ok) 15%,var(--raised))}
.verdict-line.w{background:color-mix(in srgb,var(--no) 15%,var(--raised))}

/* Auswertung, Quiz, Lexikon */
.end-head{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;margin-bottom:.5rem}
.sum{list-style:none;padding:0;margin:1rem 0;max-width:820px;display:grid;gap:.5rem}
.sum li{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px}
.sum li.w{border-left-color:var(--no)}
.sum summary{display:flex;flex-wrap:wrap;gap:.2rem .8rem;align-items:baseline;padding:.6rem .8rem;cursor:pointer}
.sum .m{font-weight:700;width:6rem;white-space:nowrap}
.sum li.r .m{color:var(--ok)}.sum li.w .m{color:var(--no)}
.sum summary small{color:var(--muted);flex-basis:100%;padding-left:6.8rem}
.sum details > div{padding:0 .8rem .8rem}
@media (max-width:520px){.sum summary small{padding-left:0}}
.quiz{max-width:780px}
.quiz .q{font-size:1.25rem;font-weight:500;margin:.8rem 0 1rem;padding:1rem 1.1rem;background:var(--raised);border:1px solid var(--line);border-radius:10px;border-left:6px solid var(--focus)}
.opts{display:grid;gap:.5rem;margin-bottom:1rem}
.opts .lt{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-weight:700;font-size:.9rem}
.opts button[disabled]{cursor:default;opacity:.7}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface));opacity:1;animation:pop .35s both}
.opts button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--surface));opacity:1;animation:shake .4s}
.opts button.cut{opacity:.35;text-decoration:line-through}
.qbar{height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden;flex:1 1 160px}
.qbar i{display:block;height:100%;background:var(--focus);transition:width .4s}
.lex{max-width:820px}
.search{display:flex;align-items:center;gap:.5rem;background:var(--raised);border:2px solid var(--ink);border-radius:99px;padding:.45rem .9rem;margin:1rem 0}
.search input{flex:1;border:0;background:none;outline:none;font-size:1.05rem;min-width:0}
.lex h3.cat{margin:1.4rem 0 .3rem;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:Barlow,sans-serif;font-weight:700}
.lex details{border-bottom:1px solid var(--line);padding:.6rem 0}
.lex summary{font:600 1.3rem/1.2 "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem}
.lex summary::-webkit-details-marker{display:none}
.lex summary::after{content:"+";font-weight:700;transition:transform .25s}
.lex details[open] summary::after{transform:rotate(45deg)}
.lex details > div{padding:.6rem 0 .2rem;animation:rise .3s both}
.lex ul,.lex ol{padding-left:1.2rem;margin:.2rem 0 .8rem}
.empty{color:var(--muted);padding:1rem 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;min-width:420px}
th,td{text-align:left;padding:.35rem .8rem .35rem 0;border-bottom:1px solid var(--line);vertical-align:top}
pre{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.6rem .8rem;overflow-x:auto;font:400 .9rem/1.5 "Courier Prime","Courier New",monospace;margin:.3rem 0 .8rem}
code{font-family:"Courier Prime","Courier New",monospace;font-weight:700}

/* Grundlagen */
.basics{max-width:900px}
.scene-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem 0}
.scene{width:100%;height:auto;display:block}
.scene .dev{fill:var(--raised);stroke:var(--ink);stroke-width:2}
.scene .scr{fill:var(--bg2);stroke:var(--line)}
.scene .lbl{font:600 13px Barlow,sans-serif;fill:var(--ink);text-anchor:middle}
.scene .sm{font:600 11px Barlow,sans-serif;fill:var(--ink)}
.scene .wire{stroke:var(--line);stroke-width:3;stroke-dasharray:6 6}
.scene .wire.secure{stroke:var(--ok);stroke-width:7;stroke-dasharray:14 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.scene .pkt rect{stroke:var(--ink);stroke-width:1.5}
.scene .go-r{animation:goR 2.4s ease-in-out infinite}
.scene .go-l{animation:goL 2.4s ease-in-out infinite}
.scene .go-l.late{animation-delay:1.2s}
@keyframes goR{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(270px);opacity:0}}
@keyframes goL{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(-270px);opacity:0}}
.scene .tick{opacity:0;animation:fadein .4s forwards}
@keyframes fadein{to{opacity:1}}
.scene .trust{fill:none;stroke:var(--signal);stroke-width:3;stroke-dasharray:8 6;animation:flow 1s linear infinite}
.scene .lock{animation:pop .5s .3s both;transform-box:fill-box;transform-origin:center}
.scene .hi{animation:glowS 1.4s ease-in-out infinite}
@keyframes glowS{50%{opacity:.4}}
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;justify-content:space-between;margin-top:.6rem}
.dots{display:flex;gap:.4rem}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0}
.dots button[aria-current="step"]{background:var(--signal);transform:scale(1.2)}
.step-txt{min-height:7.5rem;animation:rise .35s both}
.facts{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:1.4rem}

/* Erklärbär */
.bear .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bear-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:68px;height:68px;border-radius:50%;padding:4px;background:var(--surface);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink),0 10px 24px var(--shadow);transition:transform .2s}
.bear-btn:hover{transform:translateY(-3px) rotate(-6deg)}
.bear-btn .bear{width:100%;height:100%}
.bear-btn.nudge{animation:wiggle .7s ease-in-out 3}
@keyframes wiggle{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
.bear-tip{position:absolute;right:80px;bottom:14px;white-space:nowrap;background:var(--ink);color:var(--surface);font-weight:600;font-size:.92rem;padding:.4rem .7rem;border-radius:10px 10px 2px 10px;opacity:0;transform:translateX(10px);transition:opacity .3s,transform .3s;pointer-events:none}
.bear-btn.hello .bear-tip,.bear-btn.nudge .bear-tip{opacity:1;transform:none}
.bear-panel{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:41;width:min(400px,calc(100vw - 32px));max-height:min(72vh,640px);display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--ink);border-radius:16px 16px 4px 16px;box-shadow:0 18px 40px var(--shadow);transform-origin:bottom right;animation:open .3s cubic-bezier(.3,1.4,.5,1)}
.bear-panel[hidden]{display:none}
@keyframes open{from{transform:scale(.6);opacity:0}}
.bear-head{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-bottom:1px solid var(--line);background:var(--raised);border-radius:14px 14px 0 0}
.bear-head .bear{width:58px;flex:none;animation:bob 2.6s ease-in-out infinite}
.bear-head b{font:700 1.35rem/1 "Barlow Condensed",sans-serif;display:block}
.bear-head small{color:var(--muted)}
.bear-head .x{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.bear-body{padding:.9rem 1rem 1rem;overflow-y:auto;font-size:.98rem}
.bear-body > *{animation:rise .3s both}
.bear-body h4{font:600 1.1rem/1.2 "Barlow Condensed",sans-serif;margin:.9rem 0 .4rem}
.bear-body .btn{margin:.2rem 0}
.bear-say{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;margin-bottom:.7rem}
.bear-info{border-left:4px solid var(--signal);background:var(--raised);border-radius:0 8px 8px 0;padding:.5rem .7rem;margin:.6rem 0}
.bear-info p:last-child{margin-bottom:0}
.faq details{border-bottom:1px solid var(--line);padding:.45rem 0}
.faq summary{cursor:pointer;font-weight:600}
.faq details p{margin:.4rem 0 .2rem;color:var(--ink)}

/* Konfetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
</style>

<script>
/* ---------- Hilfen ---------- */
const app = document.getElementById('app');
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(12,0,0,0);
const day = n => new Date(NOW.getTime() + n*DAY);
const fmt = d => d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hash = s => [...s].reduce((a,c) => (a*37 + c.charCodeAt(0)) % 99991, 7);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const tage = (n, dativ) => n === 1 ? (dativ ? 'einem Tag' : 'einen Tag') : `${n} ${dativ ? 'Tagen' : 'Tage'}`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const keep = (key, def) => ({
  get(){ try{ return Object.assign({}, def, JSON.parse(localStorage.getItem(key) || '{}')); }catch(e){ return Object.assign({}, def); } },
  set(v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }
});
const store = keep('zk-best', {});
const prefStore = keep('cp-pref', { easy:false, sound:false, theme:'auto', seen:false });
const PREF = prefStore.get();

const ICON = {
  datum:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  name:'<svg viewBox="0 0 24 24"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/></svg>',
  kette:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  gesperrt:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
  cert:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 8h10M7 11h6"/><circle cx="16" cy="17" r="3"/><path d="M14.5 19.5L14 23l2-1 2 1-.5-3.5"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  bulb:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>'
};
const ico = k => `<span class="ico" aria-hidden="true">${ICON[k]}</span>`;

/* ---------- Daten: Kontrolle ---------- */
const STORE = ['Nordtor Root CA','Rheinsiegel Root CA','Globus Trust Root'];
const REASONS = { datum:'Datum stimmt nicht', name:'Name passt nicht', kette:'Aussteller oder Kette nicht vertrauenswürdig', gesperrt:'Zertifikat ist widerrufen' };
const ALL = ['datum','name','kette','gesperrt'];
const CHECKS = {
  datum:{ name:'Datum', q:'Liegt das Datum der Systemuhr zwischen »Gültig von« und »Gültig bis«?',
    easy:'Ist das Zertifikat heute gültig, also nicht abgelaufen und nicht erst in der Zukunft gültig?',
    where:'Schau auf die Systemuhr links und vergleiche mit den beiden Datumsfeldern im Zertifikat. Achte auch aufs Jahr.',
    more:'Nur zwischen den beiden Daten steht die CA für das Zertifikat ein. Danach prüft niemand mehr, ob es gesperrt werden müsste. Chrome meldet <code>NET::ERR_CERT_DATE_INVALID</code>. Wenn die Uhr eines Geräts falsch geht, scheitern auf einmal alle Seiten, obwohl die Zertifikate in Ordnung sind.' },
  name:{ name:'Name', q:'Steht die aufgerufene Adresse in der Liste »Gilt für«?',
    easy:'Steht die Adresse aus der Adresszeile in der Liste »Gilt für«?',
    where:'Vergleiche die Adresszeile Buchstabe für Buchstabe mit der Liste »Gilt für«. Ein Stern ersetzt genau eine Ebene.',
    more:'Ein Zertifikat gilt nur für die Namen in seiner SAN-Liste. Sonst könnte jeder mit einem Zertifikat für seine eigene Domain fremde Seiten ausliefern. Das Feld »Ausgestellt für« (CN) ignorieren moderne Browser. Chrome meldet <code>NET::ERR_CERT_COMMON_NAME_INVALID</code>.' },
  kette:{ name:'Kette', q:'Führt die Kette vom Aussteller lückenlos zu einer Root in deinem Trust Store?',
    easy:'Kannst du vom Aussteller über die mitgelieferten Zwischenzertifikate bis zu einer Root aus deinem Trust Store springen?',
    where:'Starte bei »Ausgestellt von«. Suche diesen Namen unter den Zwischenzertifikaten und spring zu dessen Aussteller. Am Ende muss ein Name aus deinem Trust Store stehen.',
    more:'Ein Zertifikat ist nur so viel wert wie die Unterschrift darauf. Dein Gerät vertraut einer Handvoll geprüfter Roots. Alles andere muss über eine lückenlose Kette auf eine davon zurückgehen. Selbstsigniert oder unbekannte Root heißt: Jeder hätte das ausstellen können. Chrome meldet <code>NET::ERR_CERT_AUTHORITY_INVALID</code>, Firefox <code>SEC_ERROR_UNKNOWN_ISSUER</code>.' },
  gesperrt:{ name:'Sperrung', q:'Meldet die Sperrabfrage, dass das Zertifikat nicht gesperrt ist?',
    easy:'Ist die Sperrabfrage unauffällig, also keine Sperrung gemeldet?',
    where:'Schau auf das Feld »Sperrabfrage bei der CA« links.',
    more:'Wird ein privater Schlüssel gestohlen, kann der Dieb sich bis zum Ablaufdatum als dieser Server ausgeben. Darum sperrt die CA das Zertifikat vorzeitig (Revoke). Browser erfahren das über Sperrlisten. Chrome meldet <code>NET::ERR_CERT_REVOKED</code>.' }
};
const stepsFor = lvl => lvl >= 4 ? ALL : ALL.slice(0, lvl);

const C = o => Object.assign({ san:[o.cn], from:-60, to:140, issuer:'Nordtor DV CA 2', chain:[['Nordtor DV CA 2','Nordtor Root CA']], store:STORE, revoked:null, clock:0, device:'Dein Rechner', tip:'' }, o);

const LEVELS = [
 { id:1, name:'Datum', sub:'Gültig von, gültig bis',
   brief:['Jedes Zertifikat hat ein Start- und ein Enddatum.','Vergleiche beide mit dem Datum deiner Systemuhr. Liegt das heutige Datum nicht dazwischen: abweisen.','In dieser Schicht stimmen Name und Aussteller immer.'] },
 { id:2, name:'Name', sub:'Passt der Ausweis zur aufgerufenen Adresse?',
   brief:['Die aufgerufene Adresse muss in der Liste »Gilt für« stehen. Nur diese Liste zählt (sie heißt SAN).','Ein Stern ersetzt genau eine Ebene: *.firma.de passt auf mail.firma.de.','Er passt nicht auf a.b.firma.de und nicht auf firma.de selbst.','Lies genau, Buchstabe für Buchstabe.'] },
 { id:3, name:'Aussteller und Kette', sub:'Wer hat unterschrieben, und kennst du ihn?',
   brief:['Jedes Zertifikat nennt seinen Aussteller. Der Server liefert die Zwischenzertifikate mit.','Folge der Kette von Aussteller zu Aussteller. Am Ende muss eine Root stehen, die in deinem Trust Store liegt.','Fehlt ein Glied, ist die Root unbekannt oder hat der Server sich selbst unterschrieben: abweisen.','Eine Root, die der Server mitliefert, zählt nicht. Nur dein Trust Store zählt.'] },
 { id:4, name:'Sperrung und Sonderfälle', sub:'Widerrufene Zertifikate und ein paar Fallen',
   brief:['Eine CA kann ein Zertifikat vor Ablauf sperren, etwa wenn der private Schlüssel gestohlen wurde.','Prüfe ab jetzt auch die Sperrabfrage.','Außerdem kann alles aus den ersten drei Schichten vorkommen.'] },
 { id:5, name:'Gemischte Schicht', sub:'Zehn zufällige Fälle aus allen Regeln',
   brief:['Zehn Fälle quer durch alle Regeln, in zufälliger Reihenfolge.','Prüfe jedes Mal alle vier Punkte: Datum, Name, Kette, Sperrung.'] }
];

const CASES = [
 /* Schicht 1 */
 C({lvl:1,target:'shop.firma.de',cn:'shop.firma.de',
    why:'Heute liegt zwischen Start- und Enddatum. Alles in Ordnung.'}),
 C({lvl:1,target:'www.kunde.de',cn:'www.kunde.de',from:-200,to:-1,
    why:'Seit gestern abgelaufen. Ein Tag reicht, der Browser macht keine Ausnahme. Ob dahinter ein Angreifer steckt oder ein Admin, der die Verlängerung vergessen hat, kannst du nicht erkennen.',
    tip:'Ablaufdaten gehören ins Monitoring, mit mindestens 14 Tagen Vorwarnung.'}),
 C({lvl:1,target:'mail.firma.de',cn:'mail.firma.de',from:-198,to:2,
    why:'Läuft erst übermorgen ab, ist also noch gültig.',

/* ---------- Prüflogik: bestimmt aus den Daten, was richtig ist ---------- */
function nameOk(target, san){
  return san.some(n => n.startsWith('*.') ? (target.endsWith(n.slice(1)) && !target.slice(0, -n.length+1).includes('.') && target.length > n.length-1) : n === target);
}
function trace(c){
  if (c.issuer === c.cn) return { ok:false, path:[c.cn], end:'self' };
  const path = [c.cn]; let iss = c.issuer;
  for (let g = 0; g < 8; g++){
    path.push(iss);
    if (c.store.includes(iss)) return { ok:true, path, end:'store' };
    const link = c.chain.find(x => x[0] === iss);
    if (!link) return { ok:false, path, end:'missing' };
    if (link[1] === iss) return { ok:false, path, end:'selfroot' };
    iss = link[1];
  }
  return { ok:false, path, end:'loop' };
}
function check(c, k){
  const d = x => fmt(day(x));
  if (k === 'datum'){
    const ok = c.clock >= c.from && c.clock <= c.to;
    let t = `Systemuhr: ${d(c.clock)}. Gültig vom ${d(c.from)} bis ${d(c.to)}. `;
    t += c.clock < c.from ? `Die Uhr liegt ${tage(c.from - c.clock, true)} vor dem Startdatum.` : c.clock > c.to ? `Das Enddatum ist seit ${tage(c.clock - c.to, true)} überschritten.` : `Liegt dazwischen, noch ${tage(c.to - c.clock)} gültig.`;
    if (c.clock !== 0) t += ' Achtung: Diese Systemuhr geht falsch, das Problem liegt beim Gerät.';
    return { ok, t };
  }
  if (k === 'name'){
    const hit = c.san.find(n => nameOk(c.target, [n]));
    if (hit) return { ok:true, t: hit === c.target ? `»${c.target}« steht wörtlich in der Liste »Gilt für«.` : `»${c.target}« passt auf »${hit}«: Der Stern ersetzt genau die eine Ebene »${c.target.slice(0, c.target.length - hit.length + 1)}«.` };
    let t = `»${c.target}« steht nicht in der Liste »Gilt für« (${c.san.join(', ')}).`;
    const w = c.san.find(n => n.startsWith('*.') && c.target.endsWith(n.slice(1)));
    if (w) t += ` ${w} deckt genau eine Ebene ab, hier wären es mehr.`;
    else if (c.san.some(n => n.startsWith('*.') && c.target === n.slice(2))) t += ' Ein Stern braucht etwas vor dem Punkt, die nackte Domain ist nicht abgedeckt.';
    else if (/^\d+\.\d+\.\d+\.\d+$/.test(c.target)) t += ' Eine IP-Adresse ist kein Name. Sie müsste extra im Zertifikat stehen.';
    return { ok:false, t };
  }
  if (k === 'kette'){
    const tr = trace(c), last = tr.path[tr.path.length-1], path = tr.path.join(' → ');
    if (tr.end === 'self') return { ok:false, t:`Aussteller und Inhaber sind beide »${c.cn}«: selbstsigniert. Das kann jeder.` };
    if (tr.ok) return { ok:true, t:`${path}. Die Root »${last}« liegt in deinem Trust Store.` };
    if (tr.end === 'selfroot') return { ok:false, t:`${path}. »${last}« hat sich selbst unterschrieben und liegt nicht in deinem Trust Store. Eine mitgelieferte Root zählt nicht.` };
    return { ok:false, t:`${path}. Für »${last}« gibt es weder ein mitgeliefertes Zertifikat noch einen Eintrag in deinem Trust Store. Die Kette reißt hier ab.` };
  }
  if (c.issuer === c.cn) return { ok:true, t:'Selbstsigniert: Es gibt keine CA, die sperren könnte. Hier also kein Befund. Gescheitert ist es schon an der Kette.' };
  if (c.revoked === null) return { ok:true, t:'Die CA meldet: nicht gesperrt.' };
  return { ok:false, t:`Die CA hat das Zertifikat am ${d(c.revoked)} gesperrt, weil der private Schlüssel kompromittiert wurde.` };
}
function verdict(c){
  const reasons = ALL.filter(k => !check(c, k).ok);
  return { ok: reasons.length === 0, reasons };
}
const protocol = (c, ks) => `<ul class="proto">${ks.map(k => { const r = check(c, k); return `<li class="${r.ok ? 'r' : 'w'}"><span class="pi" aria-hidden="true">${r.ok ? '✓' : '✗'}</span><div><b>${CHECKS[k].name}: ${r.ok ? 'in Ordnung' : 'Problem'}</b><span>${esc(r.t)}</span></div></li>`; }).join('')}</ul>`;

 ['Lebenszyklus','Sperrprüfung: CRL und OCSP','<p><b>CRL</b>: Sperrliste, die die CA regelmäßig veröffentlicht. <b>OCSP</b>: Einzelabfrage pro Zertifikat. <b>OCSP Stapling</b>: Der Server holt die Antwort selbst und liefert sie mit aus.</p><p>Browser prüfen Sperrungen heute meist über eigene, zentral verteilte Listen (Chrome: CRLSets, Firefox: CRLite). Let’s Encrypt hat OCSP 2025 eingestellt und setzt nur noch auf CRLs.</p>'],

 ['Lebenszyklus','ACME und Let’s Encrypt','<p>ACME ist das Protokoll, mit dem Zertifikate automatisch beantragt und verlängert werden. Bekannte Clients: certbot, acme.sh, win-acme (Windows). Die CA prüft per Challenge, ob du die Domain kontrollierst:</p><ul><li><b>HTTP-01</b>: Datei unter <code>/.well-known/acme-challenge/</code> ablegen. Port 80 muss von außen erreichbar sein.</li><li><b>DNS-01</b>: TXT-Eintrag <code>_acme-challenge.domain</code> setzen. Einziger Weg zu Wildcards, funktioniert auch für Server, die von außen nicht erreichbar sind.</li><li><b>TLS-ALPN-01</b>: Prüfung über Port 443, selten genutzt.</li></ul>'],

 ['Technik','Certificate Transparency','<p>Jedes öffentliche Zertifikat wird in öffentliche Logs eingetragen, sonst akzeptieren Chrome und Safari es nicht. Über <code>crt.sh</code> kann jeder nachsehen, welche Zertifikate es für eine Domain gibt. Gut, um falsch ausgestellte Zertifikate zu entdecken. Nebeneffekt: Hostnamen in öffentlichen Zertifikaten sind damit öffentlich bekannt.</p>'],

let AC = null;
function sound(type){
  if (!PREF.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const env = (a, d) => { g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.start(t); o.stop(t + d + .02); };
    if (type === 'stamp'){ o.type = 'square'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .15); env(.18, .18); }
    if (type === 'ok'){ o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(990, t + .1); env(.2, .32); }
    if (type === 'no'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.linearRampToValueAtTime(120, t + .3); env(.12, .34); }
    if (type === 'click'){ o.type = 'triangle'; o.frequency.setValueAtTime(880, t); env(.08, .06); }
    if (type === 'win'){ o.type = 'triangle'; [523,659,784,1047].forEach((f,i) => o.frequency.setValueAtTime(f, t + i*.12)); env(.2, .6); }
  }catch(e){}
}
function confetti(){

  document.body.appendChild(box); setTimeout(() => box.remove(), 4000);
}
function countUp(el, from, to){
  if (!el) return;
  if (from === to || reduced){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 700;
  const step = n => { const k = Math.min(1, (n - t0)/dur); el.textContent = Math.round(from + (to - from)*(1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function nudgeBear(){

  if (bearOpen) return;
  tip.textContent = 'Soll ich das erklären?';

function actHTML(c){
  const steps = stepsFor(S.lvl);
  if (S.phase === 'guide'){

    const chips = steps.map((s, i) => `<span class="${i === S.step ? 'cur' : i < S.step || (i === S.step && S.stepShown) ? (S.ans[s] === check(c, s).ok ? 'r' : 'w') : ''}">${ico(s)} ${CHECKS[s].name}</span>`).join('');
    if (!S.stepShown) return `<div class="guide">

      <p class="hint"><kbd>←</kbd> Nein, <kbd>→</kbd> Ja</p>
    </div>`;
    const right = S.ans[k] === r.ok, last = S.step === steps.length - 1;
    return `<div class="guide">
      <div class="gsteps">${chips}</div>
      <span class="kicker">Schritt ${S.step+1} von ${steps.length}: ${CHECKS[k].name}</span>
      <div class="verdict-line ${right ? 'r' : 'w'}"><b>${right ? 'Stimmt, +2 Punkte.' : 'Nicht ganz.'}</b> ${r.ok ? 'Hier passt alles.' : 'Hier gibt es ein Problem.'} ${esc(r.t)}</div>
      <button class="btn" data-act="gnext" data-focus>${last ? 'Zur Entscheidung' : 'Nächster Schritt'}</button>

  }
  if (S.phase === 'decide'){
    if (PREF.easy){
      const bad = steps.filter(k => !check(c, k).ok);
      return `<div class="guide">
        <div class="gsteps">${steps.map(s => `<span class="${check(c, s).ok ? 'r' : 'w'}">${ico(s)} ${CHECKS[s].name}: ${check(c, s).ok ? 'passt' : 'Problem'}</span>`).join('')}</div>

      </div>`;
    }
    return `
    <div class="choices">
      <button class="no" data-act="decide" data-v="no">✗ Abweisen</button>
      <button class="ok" data-act="decide" data-v="ok">✓ Durchlassen</button>
    </div>
    <p class="hint">Tastatur: <kbd>←</kbd> weist ab, <kbd>→</kbd> lässt durch, <kbd>H</kbd> öffnet den Erklärbär.</p>`;

    <h3>Warum weist du ab?</h3>
    <div class="reasons">${Object.entries(REASONS).map(([k,t],i) => `<button data-act="reason" data-v="${k}"${i===0?' data-focus':''}>${ico(k)} <span><kbd>${i+1}</kbd> ${esc(t)}</span></button>`).join('')}</div>

  </div>`;
}

function settle(choice, reason){
  const c = S.queue[S.i], v = verdict(c);
  const right = (choice === 'ok') === v.ok;
  let pts = 0, head, half = false;
  if (right && v.ok){ pts = 10; head = 'Richtig durchgelassen.'; }
  else if (right && v.reasons.includes(reason)){ pts = 15; head = 'Richtig abgewiesen, richtiger Grund.'; }
  else if (right){ pts = 10; half = true; head = 'Richtig abgewiesen, aber der Grund war ein anderer: ' + v.reasons.map(r => REASONS[r]).join(' und ') + '.'; }
  else if (v.ok){ head = 'Falsch. Dieses Zertifikat war in Ordnung.'; }
  else { head = 'Falsch. Das hättest du abweisen müssen: ' + v.reasons.map(r => REASONS[r]).join(' und ') + '.'; }
  if (S.hint >= 2){ pts = Math.floor(pts/2); }
  S.streak = right ? S.streak + 1 : 0;
  if (right && S.streak >= 3) pts += 2;
  S.gain = pts;
  S.pts += pts; S.choice = choice; S.phase = 'done'; S.judged = true;
  S.fb = { right, half, head };
  S.res[S.i] = { right, c, reasons:v.reasons };
  play();
}

function levelEnd(){
  view = 'end';

  const record = !best[S.lvl] || r > best[S.lvl].r;
  if (record){ best[S.lvl] = { r, n }; store.set(best); }
  const verdictText = r === n ? 'Fehlerfrei. Du bist ein Browser, wie er im Buche steht.' : r >= n*0.7 ? 'Solide. Schau dir die Fehler unten an, dann sitzt es.' : 'Das reicht noch nicht. Lies die Regeln noch einmal, probier den einfachen Modus und wiederhole die Schicht.';
  render(`
  <div class="end-head"><div><span class="kicker">Schicht ${l.id}: ${esc(l.name)}</span><h2>Schicht beendet</h2></div>${stars(k, true)}</div>
  <p class="lead" style="margin-top:.5rem">${r} von ${n} richtig entschieden, <b>${S.pts} Punkte</b>.${record && Object.keys(best).length ? ' Neue Bestleistung.' : ''} ${verdictText}</p>
  <ul class="sum">${S.res.map(x => `<li class="${x.right ? 'r' : 'w'}"><details${x.right ? '' : ' open'}><summary><span class="m">${x.right ? '✓ Richtig' : '✗ Falsch'}</span><span class="mono">${esc(x.c.target)}</span><small>${x.reasons.length ? x.reasons.map(k => REASONS[k]).join(', ') : 'Zertifikat in Ordnung'}</small></summary><div><p>${esc(x.c.why)}</p>${protocol(x.c, ALL)}</div></details></li>`).join('')}</ul>
  <div class="row">

    <g><path d="M262 64 L300 34 L338 64 Z" class="dev"/><rect x="266" y="64" width="68" height="36" class="dev"/><path d="M280 70v24M300 70v24M320 70v24" stroke="var(--ink)" stroke-width="2"/><text x="300" y="118" class="lbl">Root-CA</text></g>
    <g><rect x="40" y="110" width="110" height="72" rx="6" class="dev"/><rect x="48" y="118" width="94" height="56" rx="3" class="scr"/><rect x="28" y="182" width="134" height="10" rx="4" class="dev"/><text x="95" y="212" class="lbl">Dein Browser</text></g>
    <g><rect x="460" y="96" width="90" height="104" rx="6" class="dev"/><path d="M472 118h66M472 142h66M472 166h66" stroke="var(--line)" stroke-width="3"/><circle cx="532" cy="108" r="3.5" fill="var(--ok)"/><circle cx="532" cy="132" r="3.5" fill="var(--ok)"/><circle cx="532" cy="156" r="3.5" fill="var(--signal)"/><text x="505" y="222" class="lbl">shop.firma.de</text></g>
    ${s === 0 ? pkt('go-r', 160, 'Hallo, shop.firma.de?', 'var(--raised)') : ''}
    ${s === 1 ? pkt('go-l', 380, 'Zertifikat + Kette', 'var(--flag)') : ''}
    ${s === 2 ? ['Datum','Name','Kette','Sperrung'].map((t,i) => `<text x="56" y="${132 + i*12}" class="sm tick" style="animation-delay:${.3 + i*.45}s"><tspan fill="var(--ok)">✓</tspan> ${t}</text>`).join('') : ''}
    ${s === 3 ? `<path d="M118 112 C 150 50, 220 60, 262 82" class="trust"/><rect x="56" y="232" width="78" height="22" rx="5" fill="var(--flag)" stroke="var(--ink)" class="hi"/><text x="95" y="247" class="lbl" style="font-size:11px">Trust Store</text><text x="190" y="54" class="lbl" style="font-size:12px">Root bekannt ✓</text>` : ''}
    ${s === 4 ? pkt('go-l', 380, 'Beweis: Schlüssel', 'var(--flag)') + pkt('go-r', 160, 'Sitzungsschlüssel', 'var(--raised)') : ''}
    ${s === 5 ? `<g class="lock"><circle cx="302" cy="165" r="22" fill="var(--ok)"/><rect x="292" y="163" width="20" height="14" rx="2" fill="var(--surface)"/><path d="M296 163v-5a6 6 0 0 1 12 0v5" stroke="var(--surface)" stroke-width="3" fill="none"/></g><text x="95" y="146" class="lbl" style="font-size:22px">🔒</text>` : ''}
  </svg>`;
}
function basics(anim = true){
  view = 'basics'; setTab('basics');
  const st = BASICS[B];
  const html = `<div class="basics">
    <span class="kicker">Grundlagen</span><h2>Was passiert, wenn du eine HTTPS-Seite aufrufst?</h2>
    <div class="scene-box">
      ${basicsSVG(B)}
      <div class="step-txt" aria-live="polite"><h3>${B+1}. ${st.t}</h3><p style="margin-top:.4rem">${st.p}</p></div>
      <div class="stepper">
        <button class="btn ghost small" data-act="bstep" data-v="${B-1}" ${B === 0 ? 'disabled style="opacity:.4"' : ''}>← Zurück</button>
        <div class="dots">${BASICS.map((b,i) => `<button data-act="bstep" data-v="${i}" aria-label="Schritt ${i+1}: ${esc(b.t)}" ${i === B ? 'aria-current="step"' : ''}></button>`).join('')}</div>
        ${B < BASICS.length - 1 ? `<button class="btn small" data-act="bstep" data-v="${B+1}" data-focus>Weiter →</button>` : `<button class="btn small" data-act="brief" data-v="1" data-focus>Jetzt selbst prüfen →</button>`}
      </div>
    </div>
    <div class="facts">
      <div class="card"><h3>${ico('lock')} Verschlüsselt ≠ vertrauenswürdig</h3><p>Das Zertifikat beweist den Namen, nicht die Ehrlichkeit. Eine Betrugsseite unter ihrer eigenen Domain hat genauso ein gültiges Zertifikat.</p></div>
      <div class="card"><h3>${ico('kette')} Wer prüft wen?</h3><p>Die Root-CA prüft die Zwischen-CA, die Zwischen-CA prüft den Antragsteller. Dein Gerät vertraut nur den Roots in seinem Trust Store, alles andere leitet es davon ab.</p></div>
      <div class="card"><h3>${ico('clock')} Warum Zertifikate ablaufen</h3><p>Je kürzer ein Zertifikat gilt, desto kürzer kann ein gestohlener Schlüssel missbraucht werden. Darum sinkt die maximale Laufzeit bis 2029 auf 47 Tage.</p></div>
    </div>
  </div>`;
  if (anim) render(html); else { app.classList.remove('enter'); app.innerHTML = html; bearRefresh(); }
  const f = app.querySelector('[data-focus]'); if (f && !anim) f.focus({preventScroll:true});
}

/* ---------- Ansicht: Nachschlagen ---------- */
function lex(){
  view = 'lex'; setTab('lex');
  const cats = [...new Set(LEX.map(x => x[0]))];
  render(`<div class="lex"><span class="kicker">Nachschlagen</span><h2>Alles, was du beim Kunden brauchst</h2>
    <p style="margin-top:.5rem">Jeder Begriff in ein paar Sätzen. Aufklappen, was du brauchst, oder oben suchen.</p>
    <label class="search">${ico('search')}<span class="sr">Suchen</span><input id="lexq" type="search" placeholder="Suchen, z. B. Wildcard, PFX, ERR_CERT …" autocomplete="off"></label>
    ${cats.map(cat => `<section data-cat><h3 class="cat">${esc(cat)}</h3>${LEX.filter(x => x[0] === cat).map(([,t,h]) => `<details data-s="${esc((t + ' ' + h.replace(/<[^>]+>/g,' ')).toLowerCase())}"><summary>${esc(t)}</summary><div>${h}</div></details>`).join('')}</section>`).join('')}
    <p class="empty" id="lexEmpty" hidden>Nichts gefunden. Frag den Erklärbär, oder versuch ein anderes Wort.</p></div>`);
}
function lexFilter(q){
  q = q.trim().toLowerCase(); let any = false;
  app.querySelectorAll('[data-cat]').forEach(sec => {
    let vis = 0;
    sec.querySelectorAll('details').forEach(d => { const m = !q || d.dataset.s.includes(q); d.hidden = !m; if (m) vis++; d.open = !!q && m && q.length > 2; });
    sec.hidden = !vis; if (vis) any = true;
  });
  document.getElementById('lexEmpty').hidden = any;
}

/* ---------- Erklärbär ---------- */
function bearContent(){
  const faq = (n = FAQ.length) => `<h4>Häufige Fragen</h4><div class="faq">${FAQ.slice(0, n).map(([q,a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>`;
  if (view === 'play' && S){
    const c = S.queue[S.i], steps = stepsFor(S.lvl);
    if (S.phase === 'done'){
      const v = verdict(c);
      return `<div class="bear-say">${v.ok ? 'Dieses Zertifikat war sauber. Alle vier Prüfungen bestanden.' : `Hier hat es gehakt: <b>${v.reasons.map(r => CHECKS[r].name).join(' und ')}</b>. So kommst du drauf:`}</div>
        ${protocol(c, ALL)}
        ${v.reasons.map(r => `<div class="bear-info"><b>Warum ${CHECKS[r].name} so wichtig ist</b><p>${CHECKS[r].more}</p></div>`).join('')}
        ${v.ok ? '<div class="bear-info"><b>Merke</b><p>Durchlassen heißt nur: Der Server ist der, der er vorgibt zu sein. Ob die Seite seriös ist, sagt das Zertifikat nicht.</p></div>' : ''}
        ${S.fb && !S.fb.right && !PREF.easy ? '<p>Tipp: Schalte oben den <b>einfachen Modus</b> ein. Dann gehen wir jede Prüfung gemeinsam durch.</p>' : ''}`;
    }
    if (S.phase === 'guide'){
      const k = steps[S.step];
      return `<div class="bear-say">Wir sind bei <b>${CHECKS[k].name}</b>. Schau auf die gelb blinkenden Felder.</div>
        <p>${esc(CHECKS[k].where)}</p>
        <div class="bear-info"><b>Warum das wichtig ist</b><p>${CHECKS[k].more}</p></div>
        ${S.stepShown ? '' : `<h4>Immer noch unsicher?</h4><button class="btn ghost small" data-act="peek">Verrat’s mir</button>${S.peek ? `<div class="bear-info"><p>${esc(check(c, k).t)}</p><p><b>${check(c, k).ok ? 'Also: Ja, passt.' : 'Also: Nein, Problem.'}</b></p></div>` : ''}`}`;
    }
    if (S.phase === 'decide' && PREF.easy){
      return `<div class="bear-say">Du hast alle Punkte geprüft. Hat einer nicht gepasst: abweisen. Sonst durchlassen. Mehr steckt nicht dahinter.</div>`;
    }
    return `<div class="bear-say">Ich helfe dir, ohne gleich alles zu verraten. Erst die Regeln, und wenn das nicht reicht, der Lösungsweg.</div>
      <h4>1. Woran muss ich denken?</h4>
      ${S.hint >= 1 ? `<ul class="proto">${steps.map(k => `<li><span class="pi" style="background:var(--ink)">${ico(k)}</span><div><b>${CHECKS[k].name}</b><span>${esc(CHECKS[k].where)}</span></div></li>`).join('')}</ul>` : '<button class="btn small" data-act="hint" data-v="1">Regeln zeigen (kostenlos)</button>'}
      <h4>2. Ich komme nicht weiter</h4>
      ${S.hint >= 2 ? protocol(c, ALL) + '<p><small>Für diesen Fall gibt es nur noch die Hälfte der Punkte.</small></p>' : '<button class="btn ghost small" data-act="hint" data-v="2">Lösungsweg zeigen (halbe Punkte)</button>'}
      <p style="margin-top:1rem"><small>Oder schalte oben den einfachen Modus ein. Dann gehen wir jeden Fall Schritt für Schritt durch.</small></p>`;
  }
  if (view === 'brief'){
    const l = LEVELS.find(x => x.id === briefId);
    const ex = {
      1:'Beispiel: Gültig vom 01.01. bis 30.06., die Uhr zeigt den 15.07. Abgelaufen, also abweisen.',
      2:'Beispiel: Du rufst mail.firma.de auf. In der Liste steht *.firma.de. Der Stern ersetzt »mail«, passt. Bei dev.mail.firma.de wären es zwei Ebenen, passt nicht.',
      3:'Beispiel: Ausgestellt von »Nordtor DV CA 2«. Unter den Zwischenzertifikaten steht: Nordtor DV CA 2, ausgestellt von Nordtor Root CA. Nordtor Root CA liegt im Trust Store. Kette komplett.',
      4:'Beispiel: Alles sieht gut aus, aber die Sperrabfrage meldet »Gesperrt seit …«. Dann abweisen, egal wie gut der Rest aussieht.',
      5:'Geh jeden Fall in derselben Reihenfolge durch: Datum, Name, Kette, Sperrung. Wer die Reihenfolge einhält, übersieht nichts.'
    }[l.id];
    return `<div class="bear-say">Schicht ${l.id} dreht sich um <b>${esc(l.name)}</b>. ${esc(l.sub)}.</div>
      <div class="bear-info"><b>Ein Beispiel</b><p>${esc(ex)}</p></div>
      ${l.id <= 4 ? `<div class="bear-info"><b>Warum das wichtig ist</b><p>${CHECKS[ALL[l.id-1]].more}</p></div>` : ''}
      <p>${PREF.easy ? 'Der einfache Modus ist an. Ich führe dich durch jeden Fall.' : 'Wenn es zu schwer wird: Schalte oben den einfachen Modus ein.'}</p>
      <button class="btn small" data-act="easy">${PREF.easy ? 'Einfachen Modus ausschalten' : 'Einfachen Modus einschalten'}</button>`;
  }
  if (view === 'end' && S){
    const wrong = S.res.filter(x => !x.right);
    const by = {}; wrong.forEach(x => (x.reasons.length ? x.reasons : ['ok']).forEach(r => by[r] = (by[r] || 0) + 1));
    const top = Object.entries(by).sort((a,b) => b[1] - a[1])[0];
    return `<div class="bear-say">${!wrong.length ? 'Alles richtig. Ich bin beeindruckt, und das passiert mir nicht oft.' : top[0] === 'ok' ? 'Du hast gültige Zertifikate abgewiesen. Vorsicht ist gut, aber ein Browser, der alles blockiert, ist auch kaputt.' : `Die meisten Fehler hattest du bei <b>${CHECKS[top[0]].name}</b>. Lies dazu:`}</div>
      ${wrong.length && top[0] !== 'ok' ? `<div class="bear-info"><p>${CHECKS[top[0]].more}</p><p>${esc(CHECKS[top[0]].where)}</p></div>` : ''}
      ${wrong.length ? '<p>Die falschen Fälle sind in der Liste aufgeklappt, mit Prüfprotokoll.</p>' : ''}`;
  }
  if (view === 'quiz' && Q){
    const q = Q.list[Q.i];
    return `<div class="bear-say">Kundenfälle sind Alltag beim Support. Lies genau, was der Kunde will: neue Laufzeit, neuer Inhalt, oder ist etwas kaputt?</div>
      ${Q.picked === null ? (q.cut.length ? '<p>Zwei falsche Antworten habe ich schon gestrichen. Mehr verrate ich nicht.</p>' : '<button class="btn small" data-act="fifty">Zwei falsche Antworten streichen</button>') : ''}
      <div class="bear-info"><b>Faustregeln</b><p>Neue Laufzeit: Renew. Gleiche Laufzeit, anderer Inhalt oder Schlüssel: Reissue. Schlüssel in falschen Händen: Revoke, dann neu. Der private Schlüssel verlässt nie den Server.</p></div>
      ${faq(4)}`;
  }
  if (view === 'basics'){
    return `<div class="bear-say">Klick dich mit »Weiter« durch die sechs Schritte. Schritt 3 ist genau das, was du im Spiel machst.</div>
      <div class="bear-info"><b>Ein Vergleich</b><p>Das Zertifikat ist wie ein Personalausweis. Der Name muss stimmen, er darf nicht abgelaufen sein, und er muss von einer Behörde kommen, die du kennst. Ein selbst gebastelter Ausweis zählt nicht.</p></div>${faq(3)}`;
  }
  if (view === 'lex'){
    return `<div class="bear-say">Wo anfangen? Meine Empfehlung: <b>Zertifikat</b>, <b>Kette und Trust Store</b>, <b>SAN und Wildcard</b>, dann <b>Renew</b> und <b>Reissue</b>. Für den Support-Alltag: <b>Fehlersuche</b> und <b>Browser-Fehlermeldungen</b>.</div>${faq()}`;
  }
  return `<div class="bear-say">Hallo! Ich bin der Erklärbär. Ich erkläre dir alles rund um Zertifikate, ohne Fachchinesisch.</div>
    <h4>So geht das Spiel</h4>
    <p>Du bist der Browser. Server wollen zu dir und zeigen ein Zertifikat. Du prüfst Datum, Name, Kette und Sperrung und entscheidest: durchlassen oder abweisen.</p>
    <p>Zu schwer? Mit dem <b>einfachen Modus</b> führe ich dich Schritt für Schritt durch jede Prüfung.</p>
    <div class="row" style="margin-top:.4rem"><button class="btn small" data-act="easy">${PREF.easy ? 'Einfachen Modus ausschalten' : 'Einfachen Modus einschalten'}</button><button class="btn ghost small" data-act="tab" data-v="basics">Grundlagen ansehen</button></div>
    ${faq()}`;
}
function bearRefresh(){ if (bearOpen) document.getElementById('bearBody').innerHTML = bearContent(); }
function bearToggle(open){
  bearOpen = open ?? !bearOpen;
  const p = document.getElementById('bearPanel'), b = document.getElementById('bearBtn');
  p.hidden = !bearOpen; b.setAttribute('aria-expanded', bearOpen);
  b.classList.remove('hello','nudge');
  if (bearOpen){ bearRefresh(); p.querySelector('.x').focus(); if (!PREF.seen){ PREF.seen = true; savePref(); } }
  else b.focus();
}

/* ---------- Einstellungen ---------- */
function syncCtrl(){
  document.getElementById('easyBtn').setAttribute('aria-pressed', PREF.easy);
  document.getElementById('soundBtn').setAttribute('aria-pressed', PREF.sound);
  const tb = document.getElementById('themeBtn');
  tb.title = 'Farbschema: ' + ({auto:'automatisch', light:'hell', dark:'dunkel'})[PREF.theme];
  if (PREF.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = PREF.theme;
}

/* ---------- Steuerung ---------- */
const ACT = {
  tab(v){ v === 'quiz' ? quizHome() : v === 'lex' ? lex() : v === 'basics' ? (B = 0, basics()) : home(); window.scrollTo(0,0); },
  brief(v){ brief(v); window.scrollTo(0,0); },
  start(v){ start(v); window.scrollTo(0,0); },
  decide(v){
    if (!S || S.phase !== 'decide') return;
    if (v === 'ok') settle('ok');
    else if (PREF.easy){ const r = verdict(S.queue[S.i]).reasons; settle('no', r[0]); }
    else { S.phase = 'reason'; play(); }
  },
  reason(v){ if (S && S.phase === 'reason') settle('no', v); },
  back(){ S.phase = 'decide'; play(); },
  gans(v){
    if (!S || S.phase !== 'guide' || S.stepShown) return;
    const k = stepsFor(S.lvl)[S.step], ok = check(S.queue[S.i], k).ok;
    S.ans[k] = v === 'y'; S.stepShown = true; S.peek = false;
    if (S.ans[k] === ok){ S.pts += 2; sound('ok'); } else { sound('no'); }
    play();
  },
  gnext(){
    if (!S || S.phase !== 'guide' || !S.stepShown) return;
    S.step++; S.stepShown = false; S.peek = false;
    if (S.step >= stepsFor(S.lvl).length) S.phase = 'decide';
    play();
  },
  peek(){ if (S){ S.peek = true; bearRefresh(); } },
  next(){
    if (!S || S.phase !== 'done') return;
    if (S.i === S.queue.length - 1) levelEnd(); else { S.i++; newCaseState(); play(); }
    window.scrollTo(0,0);
  },
  hint(v){ if (S && S.phase !== 'done'){ S.hint = Math.max(S.hint, +v); bearRefresh(); } },
  pick(v){
    if (Q.picked !== null) return;
    Q.picked = +v; const q = Q.list[Q.i], ok = q.opts[Q.picked] === q.right;
    if (ok) Q.r++; if (q.cut.length) Q.helped++;
    sound(ok ? 'ok' : 'no'); quizShow();
  },
  fifty(){
    if (!Q || Q.picked !== null) return;
    const q = Q.list[Q.i]; if (q.cut.length) return;
    q.cut = shuffle(q.opts.map((o,i) => o === q.right ? -1 : i).filter(i => i > -1)).slice(0,2);
    quizShow();
  },
  qnext(){ if (Q.i === Q.list.length - 1) quizEnd(); else { Q.i++; Q.picked = null; quizShow(); } window.scrollTo(0,0); },
  bstep(v){ v = +v; if (v < 0 || v >= BASICS.length) return; B = v; basics(false); },
  bear(){ bearToggle(); },
  bearClose(){ bearToggle(false); },
  easy(){
    PREF.easy = !PREF.easy; savePref(); syncCtrl();
    if (view === 'play' && S && S.phase !== 'done'){ S.phase = PREF.easy ? 'guide' : 'decide'; S.step = 0; S.stepShown = false; S.ans = {}; play(); }
    else if (view === 'home') home();
    else if (view === 'brief') brief(briefId);
    bearRefresh();
  },
  sound(){ PREF.sound = !PREF.sound; savePref(); syncCtrl(); sound('click'); },
  theme(){ PREF.theme = ({auto:'light', light:'dark', dark:'auto'})[PREF.theme] || 'auto'; savePref(); syncCtrl(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.v);
});
document.addEventListener('input', e => { if (e.target.id === 'lexq') lexFilter(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && bearOpen){ bearToggle(false); return; }
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'h' || e.key === 'H' || e.key === '?'){ bearToggle(); return; }
  if (view === 'play' && S){
    if (S.phase === 'decide'){
      if (e.key === 'ArrowLeft'){ e.preventDefault(); ACT.decide('no'); }
      if (e.key === 'ArrowRight'){ e.preventDefault(); ACT.decide('ok'); }
    } else if (S.phase === 'guide' && !S.stepShown){
      if (e.key === 'ArrowLeft'){ e.preventDefault(); ACT.gans('n'); }
      if (e.key === 'ArrowRight'){ e.preventDefault(); ACT.gans('y'); }
    } else if (S.phase === 'reason'){
      const k = ['1','2','3','4'].indexOf(e.key);
      if (k > -1) ACT.reason(Object.keys(REASONS)[k]);
    }
  }
  if (view === 'quiz' && Q && Q.picked === null){
    const k = ['a','b','c','d'].indexOf(e.key.toLowerCase());
    if (k > -1 && !Q.list[Q.i].cut.includes(k)) ACT.pick(k);
  }
  if (view === 'basics'){
    if (e.key === 'ArrowRight') ACT.bstep(B + 1);
    if (e.key === 'ArrowLeft') ACT.bstep(B - 1);
  }
});

/* ---------- Start ---------- */
document.getElementById('bearBtn').insertAdjacentHTML('beforeend', bearSVG());
document.getElementById('bearFace').innerHTML = bearSVG();
syncCtrl();
home();
if (!PREF.seen){
  const b = document.getElementById('bearBtn');
  setTimeout(() => b.classList.add('hello'), 900);
  setTimeout(() => b.classList.remove('hello'), 7000);
}
</script>
